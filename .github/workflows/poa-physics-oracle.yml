name: Trace original EU physics setter
on:
  push:
    paths: ['.github/workflows/poa-physics-oracle.yml', 'scripts/poa_physics_oracle.c']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Recover pinned original EU helper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir recovery output
          gh release download v0.4.14 --pattern '*Three-Games.apk' --dir recovery
          python3 - <<'PY'
          import zipfile,pathlib,hashlib
          with zipfile.ZipFile(next(pathlib.Path('recovery').glob('*.apk'))) as z: data=z.read('assets/hp3data/System/Engine.dll')
          assert hashlib.sha256(data).hexdigest()=='73bbe178769b51429062c94ca0a209da3bd6e40d020588e8a4ca401427ecc34a'
          pathlib.Path('recovery/Engine.dll').write_bytes(data)
          PY
      - name: Execute isolated SetPhysics transitions
        run: |
          gcc -m32 -O1 -nostdlib -static -fno-stack-protector -fno-pie -no-pie -fno-builtin -fno-strict-aliasing -fomit-frame-pointer -fno-asynchronous-unwind-tables scripts/poa_physics_oracle.c -o recovery/physics-oracle
          timeout 30 recovery/physics-oracle > output/physics-reference.bin
          python3 - <<'PY'
          import pathlib,struct,json
          raw=pathlib.Path('output/physics-reference.bin').read_bytes()
          assert len(raw)==144*36,len(raw)
          cases=[]
          for i,offset in enumerate(range(0,len(raw),36)):
              old,new,*values=struct.unpack_from('<2i6fi',raw,offset)
              assert (old,new)==(i//12,i%12)
              stop=old!=new and new in (0,5)
              assert values[:3]==([0.0]*3 if stop else [7.0,8.0,9.0])
              assert values[3:6]==([0.0]*3 if stop else [9.0,10.0,11.0])
              cases.append({'old':old,'new':new,'velocity':values[:3],'acceleration':values[3:6],'findBaseCalls':values[6]})
          pathlib.Path('output/physics-reference.json').write_text(json.dumps({'scope':'Original EU AActor.setPhysics with synthetic zeroed actor storage, null base/mesh and stubbed floor lookup; excludes root-lock, collision, Karma and gameplay','engineSHA256':'73bbe178769b51429062c94ca0a209da3bd6e40d020588e8a4ca401427ecc34a','cases':cases},indent=2))
          print('Validated',len(cases),'original setter transitions')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: eu-physics-reference
          path: output/
          retention-days: 7
