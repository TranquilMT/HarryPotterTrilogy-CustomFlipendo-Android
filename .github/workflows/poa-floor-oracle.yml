name: Trace original EU floor discovery
on:
  push:
    paths: ['.github/workflows/poa-floor-oracle.yml', 'scripts/poa_floor_oracle.c']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Recover pinned original EU helper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir recovery output
          gh release download v0.4.14 --pattern '*Three-Games.apk' --dir recovery
          python3 - <<'PY'
          import zipfile,pathlib,hashlib
          with zipfile.ZipFile(next(pathlib.Path('recovery').glob('*.apk'))) as z: data=z.read('assets/hp3data/System/Engine.dll')
          assert hashlib.sha256(data).hexdigest()=='73bbe178769b51429062c94ca0a209da3bd6e40d020588e8a4ca401427ecc34a'
          pathlib.Path('recovery/Engine.dll').write_bytes(data)
          PY
      - name: Execute isolated SetPhysics transitions
        run: |
          gcc -m32 -O1 -nostdlib -static -fno-stack-protector -fno-pie -no-pie -fno-builtin -fno-strict-aliasing -fomit-frame-pointer -fno-asynchronous-unwind-tables scripts/poa_floor_oracle.c -o recovery/floor-oracle
          timeout 30 recovery/floor-oracle > output/floor-reference.bin
          python3 - <<'PY'
          import pathlib,struct,json
          raw=pathlib.Path('output/floor-reference.bin').read_bytes()
          assert len(raw)==36*76,len(raw)
          rows=[]
          for i,offset in enumerate(range(0,len(raw),76)):
              v=struct.unpack_from('<3I9f4I3f',raw,offset)
              scenario,old,hit=v[:3];start,end,extent=v[3:6],v[6:9],v[9:12];flags,calls,new,notify=v[12:16];normal=v[16:19]
              assert (scenario,old,hit)==(i//9,(i%9)//3,i%3)
              assert start==(10,20,30) and end==(10,20,22) and flags==223
              assert extent==(2,3 if scenario==3 else 2,5)
              assert new==hit and calls==int(old!=hit) and notify==int(old!=hit)
              assert normal==(0,0,1 if old!=hit and hit else 0)
              rows.append({'scenario':scenario,'oldBase':old,'hit':hit,'start':start,'end':end,'extent':extent,'flags':flags,'setBaseCalls':calls,'newBase':new,'notify':notify,'normal':normal})
          pathlib.Path('output/floor-reference.json').write_text(json.dumps({'scope':'Original EU FindBase/GetCollisionExtent with synthetic actor/level storage, recording trace and SetBase callbacks; excludes actual collision and VM events','engineSHA256':'73bbe178769b51429062c94ca0a209da3bd6e40d020588e8a4ca401427ecc34a','cases':rows},indent=2))
          print('Validated',len(rows),'original floor-query cases')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: eu-floor-reference
          path: output/
          retention-days: 7
