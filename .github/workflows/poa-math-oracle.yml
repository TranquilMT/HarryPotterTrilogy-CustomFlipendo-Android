name: Trace original EU quaternion math
on:
  push:
    paths: ['.github/workflows/poa-math-oracle.yml', 'scripts/poa_math_oracle.c']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Recover verified original EU math code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir recovery output
          gh release download v0.4.14 --pattern '*Three-Games.apk' --dir recovery
          python3 - <<'PY'
          import zipfile,pathlib,hashlib
          apk=next(pathlib.Path('recovery').glob('*.apk'))
          with zipfile.ZipFile(apk) as z: data=z.read('assets/hp3data/System/Core.dll')
          assert hashlib.sha256(data).hexdigest()=='b22cc27f6454eff97909ec0aa1b54a0c7aecdef2c5202e762a245ef431f92bbc'
          pathlib.Path('recovery/Core.dll').write_bytes(data)
          PY
      - name: Execute isolated original math helpers
        run: |
          gcc -m32 -O1 -nostdlib -static -fno-stack-protector -fno-pie -no-pie -fno-builtin -fomit-frame-pointer -fno-asynchronous-unwind-tables scripts/poa_math_oracle.c -o recovery/math-oracle
          timeout 30 recovery/math-oracle > output/quaternion-reference.bin
          python3 - <<'PY'
          import pathlib,struct,json,math,hashlib
          raw=pathlib.Path('output/quaternion-reference.bin').read_bytes()
          assert len(raw)==1331*88, len(raw)
          rows=[]
          for offset in range(0,len(raw),88):
              row=struct.unpack_from('<3i4f3i12f',raw,offset)
              assert all(math.isfinite(v) for v in row)
              rows.append({'input':row[:3],'quat':row[3:7],'output':row[7:10],'basis':row[10:]})
          pathlib.Path('output/quaternion-reference.json').write_text(json.dumps({'scope':'Isolated EU Core.dll math helpers only; no Windows entry point or gameplay','coreSHA256':'b22cc27f6454eff97909ec0aa1b54a0c7aecdef2c5202e762a245ef431f92bbc','cases':rows},indent=2))
          anchor=next(r for r in rows if list(r['input'])==[0,0,16384])
          assert abs(anchor['output'][2]-16384)<8, anchor
          print('Validated',len(rows),'original EU math cases')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: eu-quaternion-reference
          path: output/
          retention-days: 7
