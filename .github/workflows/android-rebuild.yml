name: Rebuild Android ARM64 engine
on:
  push:
    branches: [main]
    paths: ['.github/workflows/android-rebuild.yml', 'native-runtime/src/engine/**', 'native-runtime/src/hp3/**', 'native-runtime/tools/poa/**', 'native-runtime/android/tests/**', 'native-runtime/android/prepare_test_apk.py', 'native-runtime/tools/graphics/**', 'docs/POA-MENU-ACCEPTANCE.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-rebuild
  cancel-in-progress: true
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Restore pinned original EU regression data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p recovery fixtures
          gh release download v0.4.14 --pattern '*Three-Games.apk' --dir recovery
          echo '05235ab2631b0e25f402f3f576566441190e9bae5af851380627d0f31d8784e9  recovery/HP-Trilogy-Mobile-0.4.14-Three-Games.apk' | sha256sum -c -
          python3 - <<'PY'
          import zipfile,pathlib
          prefix='assets/hp3data/'
          with zipfile.ZipFile('recovery/HP-Trilogy-Mobile-0.4.14-Three-Games.apk') as z:
              for item in z.infolist():
                  if not item.filename.startswith(prefix): continue
                  name=item.filename[len(prefix):]
                  if pathlib.PurePosixPath(name).suffix.lower() not in ('.u','.usx','.ukx'): continue
                  assert '..' not in pathlib.PurePosixPath(name).parts
                  target=pathlib.Path('fixtures/hp3')/name
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(z.read(item))
          PY
      - name: Verify GLES reflection clipping on software GPU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libegl-mesa0
          python3 native-runtime/tools/graphics/check_reflection_clip.py
      - name: Run compatibility and Android packaging regressions
        env:
          HP3_EU_GAME: ${{ github.workspace }}/fixtures/hp3
          POA_EU_GAME: ${{ github.workspace }}/fixtures/hp3
          ASAN_OPTIONS: detect_leaks=0
        run: |
          python3 -m unittest discover -s native-runtime/tools/poa -p 'test_*.py'
          PYTHONPATH=native-runtime/android python3 -m unittest discover -s native-runtime/android/tests -p 'test_*.py'
  build:
    needs: host-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Restore pinned build dependencies and original payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p recovery output
          gh release download v0.4.13 --pattern '*Full-Source.zip' --dir recovery
          echo '3d57e16eb180927769040c7d0dd76f3e9ac7c3e819fd5f8f098c1630f2838f01  recovery/HP-Trilogy-Mobile-0.4.13-Full-Source.zip' | sha256sum -c -
          python3 - <<'PY'
          import zipfile, pathlib
          prefix = 'native-runtime/android/deps/SDL/'
          with zipfile.ZipFile('recovery/HP-Trilogy-Mobile-0.4.13-Full-Source.zip') as z:
              for item in z.infolist():
                  if item.filename.startswith(prefix):
                      if '..' in pathlib.PurePosixPath(item.filename).parts:
                          raise ValueError('Unsafe dependency path')
                      z.extract(item, '.')
          assert pathlib.Path(prefix + 'CMakeLists.txt').is_file()
          core = pathlib.Path('native-runtime/src/hp3/PoaCore.cpp').read_text()
          for name in ['Acos', 'Asin', 'Greater_StrStr', 'GetLastStateName', 'QuatProduct', 'QuatRotateVector', 'QuatFromAxisAndAngle']:
              assert '"' + name + '"' in core, name
          PY
      - name: Install native toolchain
        run: |
          echo y | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.2.12479018'
          python3 -m pip install cmake==3.31.6 ninja==1.11.1.4
      - name: Compile current patched engine
        run: |
          cmake -S native-runtime/android -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_HOME}/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-z,max-page-size=16384"
          cmake --build build-android --target main --parallel 4
          mkdir -p output/native
          cp build-android/libmain.so build-android/SDL3/libSDL3.so \
             build-android/engine/Thirdparty/openal-soft/libopenal.so \
             build-android/engine/libSurrealVideo.so output/native/
          git rev-parse HEAD > output/native/source-commit.txt
          sha256sum output/native/*.so > output/native/SHA256.txt
      - name: Gate APK assembly on completed menu integration
        id: menu-gate
        run: |
          python3 - <<'PYMENU'
          import json,os,pathlib
          ready=json.loads(pathlib.Path('docs/POA-MENU-ACCEPTANCE.json').read_text()).get('sourceIntegrationReady') is True
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('ready='+str(ready).lower()+'\n')
          print('Menu source integration ready:',ready)
          PYMENU
      - name: Prepare versioned three-game test APK for permanent-key signing
        if: steps.menu-gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.4.14 --pattern '*Three-Games.apk' --dir recovery
          echo '05235ab2631b0e25f402f3f576566441190e9bae5af851380627d0f31d8784e9  recovery/HP-Trilogy-Mobile-0.4.14-Three-Games.apk' | sha256sum -c -
          bt="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p output/apk
          "$bt/aapt2" compile --dir native-runtime/android/res -o recovery/res.zip
          "$bt/aapt2" link -o recovery/test-resources.apk --manifest native-runtime/android/AndroidManifest.xml -I "$ANDROID_HOME/platforms/android-36/android.jar" -R recovery/res.zip --min-sdk-version 29 --target-sdk-version 35 --version-name 0.4.15-test --version-code 57
          python3 native-runtime/android/prepare_test_apk.py recovery/HP-Trilogy-Mobile-0.4.14-Three-Games.apk output/native recovery/test-resources.apk recovery/test-unsigned.apk "$GITHUB_SHA"
          "$bt/zipalign" -f -P 16 4 recovery/test-unsigned.apk output/apk/HP-Trilogy-Mobile-0.4.15-test-UNSIGNED.apk
          "$bt/zipalign" -c -P 16 4 output/apk/*UNSIGNED.apk
          "$bt/aapt2" dump badging output/apk/*UNSIGNED.apk > output/apk/package.txt
          grep -q "name='com.tranquil.hp1native' versionCode='57' versionName='0.4.15-test'" output/apk/package.txt
          sha256sum output/apk/*UNSIGNED.apk > output/apk/SHA256.txt
          echo 'Unsigned build: requires the original permanent signing key before installation. Published release is unchanged.' > output/apk/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-0.4.14-native-libraries
          path: output/
          compression-level: 6
          retention-days: 7
          if-no-files-found: error
