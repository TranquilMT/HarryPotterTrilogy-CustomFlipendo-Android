name: Reconstruct and publish signed v0.4.13
on:
  push:
    branches: [main]
    paths: ['release-recovery/0.4.13/**', '.github/workflows/publish-0.4.13.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-0.4.13
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download verified base and full source
        run: |
          mkdir -p base dist
          gh release download v0.4.11 --pattern '*Three-Games.apk' --dir base
          mv base/*Three-Games.apk base/previous.apk
          gh release download v0.4.13 --pattern '*Full-Source.zip' --dir dist
          echo '3d57e16eb180927769040c7d0dd76f3e9ac7c3e819fd5f8f098c1630f2838f01  dist/HP-Trilogy-Mobile-0.4.13-Full-Source.zip' | sha256sum -c -
      - name: Reconstruct exact signed APK
        run: |
          python3 scripts/reconstruct_apk.py base/previous.apk release-recovery/0.4.13 dist/HP-Trilogy-Mobile-0.4.13-Three-Games.apk
          cp docs/HP-Trilogy-Mobile-0.4.13-Verification.json dist/
          cp docs/HP3-0.4.13-CHANGES.md dist/HP-Trilogy-Mobile-0.4.13-Changes.md
          cp docs/HP3-COMPATIBILITY-ROADMAP.md dist/HP3-Compatibility-Roadmap.md
          cp docs/HP-Trilogy-Mobile-0.4.13-SHA256.txt dist/
          cd dist
          sha256sum -c HP-Trilogy-Mobile-0.4.13-SHA256.txt
      - name: Verify Android package and signing continuity
        run: |
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$tools/apksigner" verify --verbose --print-certs dist/*Three-Games.apk > signature.txt
          grep -q 'Signer #1 certificate SHA-256 digest: 25aa34c1db19a5007e934df03f5927e4b71a990856fe439a57e3e73ead8eae40' signature.txt
          "$tools/zipalign" -c -P 16 4 dist/*Three-Games.apk
          "$tools/aapt2" dump badging dist/*Three-Games.apk > package.txt
          grep -q "name='com.tranquil.hp1native' versionCode='55' versionName='0.4.13'" package.txt
      - name: Upload and verify release assets
        run: |
          gh release upload v0.4.13 dist/* --clobber
          gh api repos/$GITHUB_REPOSITORY/releases/437823082/assets > assets.json
          python3 - <<'PY'
          import json,hashlib,pathlib
          actual={r['name']:r['digest'] for r in json.load(open('assets.json'))}
          for p in pathlib.Path('dist').iterdir():
              with p.open('rb') as f: expected='sha256:'+hashlib.file_digest(f,'sha256').hexdigest()
              assert actual[p.name]==expected, p.name
          print('All uploaded release asset digests match')
          PY
          gh release edit v0.4.13 --target "$GITHUB_SHA" --title 'HP:Trilogy Mobile 0.4.13 — HP3 startup compatibility' --notes-file docs/RELEASE-0.4.13.md --draft=false --prerelease=false --latest
