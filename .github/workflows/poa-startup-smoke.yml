name: Trace complete PoA engine startup
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/poa-startup-smoke.yml']
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install host graphics and build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libdbus-1-dev libx11-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev libfontconfig1-dev libglib2.0-dev libopenal-dev libasound2-dev libvulkan-dev xvfb xauth
      - name: Restore verified three-game release EU payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p recovery fixtures output
          gh release download v0.4.14 --pattern '*Three-Games.apk' --dir recovery
          echo '05235ab2631b0e25f402f3f576566441190e9bae5af851380627d0f31d8784e9  recovery/HP-Trilogy-Mobile-0.4.14-Three-Games.apk' | sha256sum -c -
          python3 - <<'PY'
          import zipfile,pathlib
          prefix='assets/hp3data/'
          with zipfile.ZipFile('recovery/HP-Trilogy-Mobile-0.4.14-Three-Games.apk') as z:
              for item in z.infolist():
                  if not item.filename.startswith(prefix) or item.is_dir():continue
                  name=pathlib.PurePosixPath(item.filename[len(prefix):])
                  assert not name.is_absolute() and '..' not in name.parts
                  target=pathlib.Path('fixtures/hp3')/str(name)
                  target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(z.read(item))
          assert pathlib.Path('fixtures/hp3/System/hppoa.exe').is_file()
          PY
      - name: Build full native host engine
        run: |
          cmake -S native-runtime/src/engine -B build-host -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_SDL2=OFF -DENABLE_SDL3=OFF
          cmake --build build-host --target SurrealEngine Resources --parallel 4 > output/build.log 2>&1 || { tail -n 100 output/build.log; exit 1; }
      - name: Run original startup scripts for 30 frames
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: |
          set +e
          xvfb-run -a -s '-screen 0 1280x720x24' timeout 90 build-host/SurrealEngine --autolaunch --renderer=opengl --logfile="$GITHUB_WORKSPACE/output/startup.log" --poa-smoke-frames=30 "$GITHUB_WORKSPACE/fixtures/hp3" > output/stdout.log 2>&1
          result=$?
          set -e
          echo "$result" > output/exit-code.txt
          tail -n 100 output/stdout.log
          if [ -f output/startup.log ]; then tail -n 100 output/startup.log; fi
          test "$result" -eq 0
          grep -q 'POA_SMOKE_RENDERED_FRAMES' output/startup.log
          echo 'Thirty native host frames only; original GUI interaction, Android execution and gameplay are not accepted by this check.' > output/SCOPE.txt
      - name: Retain startup diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: poa-native-startup-diagnostics
          path: output/
          retention-days: 14
